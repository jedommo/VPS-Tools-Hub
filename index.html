<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MAMDOUH SCRIPTS — iOS 26 & macOS Glass Command Hub</title>
  <meta name="description" content="An ultra-futuristic iOS 26 and macOS Liquid Glass command center to discover, install, and manage Linux VPS scripts." />
  
  <!-- Theme Restoration (Prevents theme flash) -->
  <script>
    if (localStorage.getItem('vps_hub_theme') === 'light') {
      document.documentElement.classList.remove('dark');
    } else {
      document.documentElement.classList.add('dark');
    }
  </script>

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['SF Pro Display', 'Inter', 'ui-sans-serif', 'system-ui'],
            mono: ['JetBrains Mono', 'ui-monospace', 'SFMono-Regular']
          },
          colors: {
            brand: {
              50:  '#eef7ff', 100: '#d8ecff', 200: '#b9deff', 300: '#89caff',
              400: '#51aaff', 500: '#00f0ff', 600: '#1a6bf5', 700: '#1354e1',
              800: '#1746b6', 900: '#193d8f',
            }
          }
        }
      }
    }
  </script>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
  
  <!-- Custom Stylesheet -->
  <link rel="stylesheet" href="style.css">
</head>
<body class="antialiased wp-aurora">

  <!-- Interactive Backdrop Canvas -->
  <canvas id="constellation-canvas"></canvas>

  <!-- macOS TOP STATUS MENU BAR -->
  <header class="mac-menubar">
    <div class="mac-menu-left">
      <a href="#/" class="apple-logo-btn">
        <i data-lucide="command" class="w-4 h-4 text-brand-500"></i>
        <span>MAMDOUH OS</span>
      </a>
      <a href="#/" class="mac-menu-item" data-route="/">Home</a>
      <a href="#/tools" class="mac-menu-item" data-route="/tools">Tools</a>
      <a href="#/categories" class="mac-menu-item" data-route="/categories">Categories</a>
      <a href="#/quick-install" class="mac-menu-item" data-route="/quick-install">Quick Install</a>
      <a href="#/low-ram" class="mac-menu-item" data-route="/low-ram">Low RAM</a>
      <a href="#/calculator" class="mac-menu-item" data-route="/calculator">Calculator</a>
      <a href="#/docs" class="mac-menu-item" data-route="/docs">Docs</a>
    </div>

    <!-- iOS Dynamic Island Center Pill -->
    <div class="dynamic-island" onclick="toggleControlCenter()" title="System Health & Controls">
      <span class="w-2 h-2 rounded-full bg-[#00f0ff] animate-pulse"></span>
      <span class="font-semibold text-white">VPS HUB v2.6</span>
      <span class="text-xs text-slate-400">| 99.9% ONLINE</span>
    </div>

    <div class="mac-menu-right">
      <button onclick="openSearch()" class="mac-icon-btn" title="Spotlight Search (Cmd+K)">
        <i data-lucide="search" class="w-4 h-4"></i>
      </button>
      <button onclick="toggleTheme()" class="mac-icon-btn" title="Theme Mode">
        <i data-lucide="sun" id="theme-icon" class="w-4 h-4"></i>
      </button>
      <button onclick="toggleControlCenter()" class="mac-icon-btn" title="iOS Control Center">
        <i data-lucide="sliders" class="w-4 h-4"></i>
      </button>
      <button onclick="openAdmin()" class="mac-icon-btn hidden sm:flex" title="Admin Settings">
        <i data-lucide="settings" class="w-4 h-4"></i>
      </button>

      <!-- macOS Digital Live Clock -->
      <div id="mac-clock" class="mac-clock ml-1">09:15 AM</div>
    </div>
  </header>

  <!-- iOS CONTROL CENTER DRAWER -->
  <div id="control-center-drawer" class="control-center-drawer">
    <div class="flex items-center justify-between border-b border-white/10 pb-3 mb-3">
      <div class="flex items-center gap-2">
        <i data-lucide="sliders" class="w-5 h-5 text-brand-500"></i>
        <span class="font-bold text-sm">Control Center</span>
      </div>
      <button onclick="toggleControlCenter()" class="p-1 rounded-lg hover:bg-white/10"><i data-lucide="x" class="w-4 h-4"></i></button>
    </div>

    <div class="space-y-4">
      <!-- Live Server Health Widget -->
      <div class="glass p-3 rounded-2xl">
        <div class="flex justify-between items-center text-xs text-slate-400 mb-1">
          <span>Server Memory</span>
          <span id="cc-ram-usage" class="text-brand-500 font-mono">180 / 1024 MB</span>
        </div>
        <div class="w-full bg-white/10 h-2 rounded-full overflow-hidden">
          <div class="bg-gradient-to-r from-brand-500 to-purple-500 h-full w-[18%] transition-all duration-500"></div>
        </div>
      </div>

      <!-- Wallpaper Selector Tiles -->
      <div>
        <label class="block text-xs font-semibold text-slate-300 mb-2">Liquid Wallpapers</label>
        <div class="grid grid-cols-2 gap-2">
          <button onclick="setWallpaper('wp-aurora')" class="glass p-2 text-left rounded-xl hover:border-brand-500 transition text-xs flex items-center gap-2">
            <span class="w-3 h-3 rounded-full bg-gradient-to-br from-cyan-400 to-purple-600"></span> Aurora Glass
          </button>
          <button onclick="setWallpaper('wp-sequoia')" class="glass p-2 text-left rounded-xl hover:border-brand-500 transition text-xs flex items-center gap-2">
            <span class="w-3 h-3 rounded-full bg-gradient-to-br from-rose-500 to-orange-500"></span> macOS Sequoia
          </button>
          <button onclick="setWallpaper('wp-crystal')" class="glass p-2 text-left rounded-xl hover:border-brand-500 transition text-xs flex items-center gap-2">
            <span class="w-3 h-3 rounded-full bg-gradient-to-br from-blue-500 to-cyan-300"></span> Liquid Crystal
          </button>
          <button onclick="setWallpaper('wp-deepspace')" class="glass p-2 text-left rounded-xl hover:border-brand-500 transition text-xs flex items-center gap-2">
            <span class="w-3 h-3 rounded-full bg-gradient-to-br from-slate-700 to-slate-950"></span> Deep Space
          </button>
        </div>
      </div>

      <!-- Terminal Theme Quick Switcher -->
      <div>
        <label class="block text-xs font-semibold text-slate-300 mb-2">Terminal Theme</label>
        <select onchange="setTerminalTheme(this.value)" class="w-full bg-white/10 border border-white/20 rounded-xl p-2 text-xs font-mono text-white outline-none">
          <option value="classic">Classic Cyan</option>
          <option value="onedark">One Dark Pro</option>
          <option value="dracula">Dracula Glass</option>
          <option value="matrix">Matrix Hacker</option>
        </select>
      </div>
    </div>
  </div>

  <!-- SPOTLIGHT SEARCH MODAL -->
  <div id="search-modal" class="search-modal" onclick="if(event.target===this) closeSearch()">
    <div class="search-modal-content">
      <div class="mac-window-bar">
        <div class="mac-dots">
          <span class="mac-dot mac-dot-close" onclick="closeSearch()"></span>
          <span class="mac-dot mac-dot-min"></span>
          <span class="mac-dot mac-dot-max"></span>
        </div>
        <span class="text-xs font-semibold text-slate-400">Spotlight Search</span>
        <kbd class="text-[10px] px-2 py-0.5 rounded bg-white/10 border border-white/20">ESC</kbd>
      </div>

      <div class="flex items-center gap-3 p-4 border-b border-white/10">
        <i data-lucide="search" class="w-5 h-5 text-brand-500"></i>
        <input id="search-input" type="text" placeholder="Search VPS tools, categories, commands..." class="flex-1 bg-transparent outline-none text-lg text-white" oninput="liveSearch(this.value)">
      </div>
      <div id="search-results" class="max-h-[55vh] overflow-y-auto p-2"></div>
    </div>
  </div>

  <!-- ADMIN MODAL -->
  <div id="admin-modal" class="search-modal" onclick="if(event.target===this) closeAdmin()">
    <div class="search-modal-content" style="width: min(900px, 95%); max-height: 85vh;">
      <div class="mac-window-bar">
        <div class="mac-dots">
          <span class="mac-dot mac-dot-close" onclick="closeAdmin()"></span>
          <span class="mac-dot mac-dot-min"></span>
          <span class="mac-dot mac-dot-max"></span>
        </div>
        <span class="text-xs font-semibold text-slate-400">System Preferences & Tools Directory</span>
        <div></div>
      </div>
      <div class="p-6 overflow-y-auto" id="admin-content"></div>
    </div>
  </div>

  <!-- MAIN APP VIEWPORT -->
  <main id="app" class="relative min-h-screen"></main>

  <!-- macOS / iOS FLOATING TRANSLUCENT DOCK -->
  <nav class="mac-dock-container">
    <div class="mac-dock">
      <a href="#/" class="dock-item" data-route="/" title="Home">
        🏠
        <span class="dock-tooltip">Home</span>
      </a>
      <a href="#/tools" class="dock-item" data-route="/tools" title="Tools">
        🧰
        <span class="dock-tooltip">Tools</span>
      </a>
      <a href="#/categories" class="dock-item" data-route="/categories" title="Categories">
        📂
        <span class="dock-tooltip">Categories</span>
      </a>
      <a href="#/quick-install" class="dock-item" data-route="/quick-install" title="Quick Install">
        ⚡
        <span class="dock-tooltip">Quick Install</span>
      </a>
      <a href="#/low-ram" class="dock-item" data-route="/low-ram" title="Low RAM">
        🔋
        <span class="dock-tooltip">Low RAM</span>
      </a>
      <a href="#/calculator" class="dock-item" data-route="/calculator" title="Calculator">
        🧮
        <span class="dock-tooltip">Calculator</span>
      </a>
      <a href="#/docs" class="dock-item" data-route="/docs" title="Documentation">
        📖
        <span class="dock-tooltip">Docs</span>
      </a>

      <div class="dock-separator"></div>

      <button onclick="toggleControlCenter()" class="dock-item" title="Control Center">
        🎛️
        <span class="dock-tooltip">Controls</span>
      </button>
      <button onclick="openAdmin()" class="dock-item" title="Admin Settings">
        ⚙️
        <span class="dock-tooltip">Admin</span>
      </button>
    </div>
  </nav>

  <!-- TOAST NOTIFICATION -->
  <div id="toast" class="toast"></div>

  <!-- Custom Scripts -->
  <script src="script.js"></script>
</body>
</html>
